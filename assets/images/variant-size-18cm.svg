<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEAA88"/>
      <stop offset="100%" stop-color="#C28B65"/>
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231B15"/>
      <stop offset="100%" stop-color="#140E0A"/>
    </linearGradient>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B87B44"/>
      <stop offset="50%" stop-color="#8C5326"/>
      <stop offset="100%" stop-color="#5E3414"/>
    </linearGradient>
    <linearGradient id="woodTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C88E56"/>
      <stop offset="100%" stop-color="#9C6030"/>
    </linearGradient>
    <linearGradient id="clothes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3035"/>
      <stop offset="100%" stop-color="#18191C"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Wooden Pedestal Base -->
  <g id="base" transform="translate(0, 10)">
    <!-- Base Bottom/Side 3D Ellipse -->
    <path d="M40 280 C40 295 160 295 160 280 L160 292 C160 307 40 307 40 292 Z" fill="url(#woodBase)"/>
    <!-- Base Top Surface -->
    <ellipse cx="100" cy="280" rx="60" ry="12" fill="url(#woodTop)" stroke="#7A441B" stroke-width="1"/>
    <!-- Wood grain subtle rings -->
    <ellipse cx="100" cy="280" rx="42" ry="7.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  </g>

  <!-- Body (Black outfit) -->
  <g id="body" filter="url(#dropShadow)">
    <!-- Shoes -->
    <ellipse cx="86" cy="275" rx="10" ry="6" fill="#1C1D20"/>
    <ellipse cx="114" cy="275" rx="10" ry="6" fill="#1C1D20"/>
    <!-- Pants -->
    <path d="M78 220 L80 274 L94 274 L97 232 L103 232 L106 274 L120 274 L122 220 Z" fill="#1E2024"/>
    <!-- T-Shirt Torso -->
    <path d="M72 170 C72 165 128 165 128 170 L126 224 C126 226 74 226 74 224 Z" fill="url(#clothes)"/>
    <!-- Sleeves & Arms -->
    <path d="M72 170 L60 200 C58 206 66 210 70 205 L76 182 Z" fill="url(#clothes)"/>
    <path d="M128 170 L140 200 C142 206 134 210 130 205 L124 182 Z" fill="url(#clothes)"/>
    <!-- Hands -->
    <circle cx="63" cy="208" r="6.5" fill="url(#skin)"/>
    <circle cx="137" cy="208" r="6.5" fill="url(#skin)"/>
  </g>

  <!-- Head & Hair (Large Bobblehead Proportion) -->
  <g id="head" filter="url(#dropShadow)">
    <!-- Neck -->
    <rect x="94" y="152" width="12" height="18" fill="#B87D56" rx="3"/>
    
    <!-- Ears -->
    <ellipse cx="64" cy="115" rx="6" ry="9" fill="#C28B65"/>
    <ellipse cx="136" cy="115" rx="6" ry="9" fill="#C28B65"/>
    <!-- Earring -->
    <circle cx="62" cy="120" r="2" fill="#E5E7EB"/>

    <!-- Braided Hair Base / Silhouette -->
    <path d="M66 112 C64 68 80 50 100 50 C120 50 136 68 134 112 C134 128 132 135 128 140 C124 125 124 85 100 85 C76 85 76 125 72 140 C68 135 66 128 66 112 Z" fill="url(#hair)"/>

    <!-- Face Shape -->
    <path d="M70 100 C70 74 130 74 130 100 C130 132 122 154 100 154 C78 154 70 132 70 100 Z" fill="url(#skin)"/>

    <!-- Cornrow / Braid Texture Lines -->
    <path d="M82 58 Q88 78 86 92" stroke="#100A06" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M94 52 Q96 74 96 92" stroke="#100A06" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M106 52 Q104 74 104 92" stroke="#100A06" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M118 58 Q112 78 114 92" stroke="#100A06" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Eyebrows -->
    <path d="M78 96 Q87 91 94 95" stroke="#1E140D" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    <path d="M106 95 Q113 91 122 96" stroke="#1E140D" stroke-width="2.8" fill="none" stroke-linecap="round"/>

    <!-- Eyes (Friendly, cartoon smile expression) -->
    <ellipse cx="86" cy="106" rx="4.5" ry="3.5" fill="#1C140E"/>
    <circle cx="87.5" cy="105" r="1.2" fill="#FFF"/>
    <ellipse cx="114" cy="106" rx="4.5" ry="3.5" fill="#1C140E"/>
    <circle cx="115.5" cy="105" r="1.2" fill="#FFF"/>

    <!-- Nose -->
    <path d="M98 106 Q100 118 97 121 Q100 123 103 121 Q102 118 102 106" fill="#B0754E"/>

    <!-- Mustache & Beard/Goatee -->
    <path d="M90 126 Q100 128 110 126 Q100 131 90 126 Z" fill="#1C140E"/>
    <!-- Goatee -->
    <path d="M95 142 Q100 148 105 142 Q100 152 95 142 Z" fill="#1C140E"/>

    <!-- Smiling Mouth with Teeth -->
    <path d="M86 130 Q100 144 114 130 Z" fill="#751515"/>
    <path d="M88 131 Q100 137 112 131 Q100 131 88 131 Z" fill="#FFFFFF"/>

    <!-- Cheek Blush/Highlights -->
    <ellipse cx="78" cy="116" rx="4" ry="2" fill="rgba(200,80,60,0.15)"/>
    <ellipse cx="122" cy="116" rx="4" ry="2" fill="rgba(200,80,60,0.15)"/>
  </g>
</svg>
