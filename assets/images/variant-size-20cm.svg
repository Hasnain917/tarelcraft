<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="skin20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B190"/>
      <stop offset="100%" stop-color="#C58E68"/>
    </linearGradient>
    <linearGradient id="hair20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#231B15"/>
      <stop offset="100%" stop-color="#140E0A"/>
    </linearGradient>
    <linearGradient id="woodBase20" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2844B"/>
      <stop offset="50%" stop-color="#935728"/>
      <stop offset="100%" stop-color="#643816"/>
    </linearGradient>
    <linearGradient id="woodTop20" x1="0%" y1="0%" x2="100%" y2="100%">
