      <path d="M65 110 C63 65 79 47 100 47 C121 47 137 65 135 110 C135 126 133 133 129 138 C125 123 125 83 100 83 C75 83 75 123 71 138 C67 133 65 126 65 110 Z" fill="url(#hair20)"/>

